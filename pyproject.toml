[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pta-spider"
version = "0.1.0"
description = "PTA crawling and synchronization service"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "requests",
    "httpx",
    "pydantic",
    "selenium",
    "webdriver-manager",
    "opencv-python",
    "python-dotenv",
    "pymysql",
    "bcrypt",
]

[tool.setuptools.packages.find]
where = ["src"]
