spring:
  application:
    name: AI_server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ptadatabase?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true&rewriteBatchedStatements=true
    username: root
    password: '123456'
    hikari:
      connection-timeout: 20000
      maximum-pool-size: ${DB_POOL_MAX:30}
      minimum-idle: ${DB_POOL_MIN:10}
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 60000
      pool-name: HikariPool-Main
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    show-sql: false
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
          fetch_size: 50
        order_inserts: true
        order_updates: true
        generate_statistics: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX:16}
          max-idle: 8
          min-idle: 4
          max-wait: 3000ms
      # 临时禁用Redis以便测试
      timeout: 1000ms
      connect-timeout: 1000ms
  servlet:
    session:
      timeout: 3600
    multipart:
      max-file-size: 512MB
      max-request-size: 520MB
  task:
    execution:
      pool:
        core-size: 8
        max-size: 32
        queue-capacity: 200
        keep-alive: 60s
      thread-name-prefix: async-
    scheduling:
      pool:
        size: 4
      thread-name-prefix: sched-

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    map-underscore-to-camel-case: true
    local-cache-scope: STATEMENT
  mapper-locations: classpath:/mappers/*.xml
  type-aliases-package: com.cqust.ai_server.entity

pagehelper:
  helper-dialect: mysql

logging:
  level:
    root: info
    com:
      cqust:
        ai_server:
          dao: info
          controller: info
      tap:
        backend: info
    org:
      springframework:
        jdbc: warn
        transaction: warn
        web: warn

server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:200}
      min-spare: ${TOMCAT_MIN_SPARE:20}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:8192}
    accept-count: ${TOMCAT_ACCEPT_COUNT:100}
    connection-timeout: 20000
    keep-alive-timeout: 30000
    max-keep-alive-requests: 100
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

apk:
  api:
    key: cd5f887d-6484-47b9-afbd-dd1c66646e89

volcano:
  api:
    key: cd5f887d-6484-47b9-afbd-dd1c66646e89
    model: deepseek-r1-250120

# ========== LeetCode 推荐系统配置 ==========
leetcode:
  recommendation:
    # 推荐算法权重配置
    weights:
      need-match: 0.45
      difficulty-fit: 0.20
      success-prob: 0.15
      novelty: 0.10
      quality: 0.10
      repeat-penalty: 0.15
    # 召回配置
    recall:
      weak-skill-ratio: 0.60
      difficulty-progression-ratio: 0.25
      exploration-ratio: 0.15
    # 多样性配置
    diversity:
      min-easy-count: 2
      min-medium-count: 4
      max-hard-count: 2
    # 缓存配置
    cache:
      recommendation-ttl-minutes: 30
      skill-profile-ttl-minutes: 60
tap:
  security:
    jwt:
      issuer: ${JWT_ISSUER:tap}
      secret: ${JWT_SECRET:CHANGE_ME_PLEASE_CHANGE_ME_32_BYTES_MINIMUM_123456}
      access-token-ttl-seconds: ${JWT_TTL_SECONDS:3600}
  quota:
    translation-chars-per-day: ${QUOTA_TRANSLATION_CHARS_PER_DAY:200000}
    ai-requests-per-day: ${QUOTA_AI_REQUESTS_PER_DAY:200}
    admin-unlimited: ${QUOTA_ADMIN_UNLIMITED:true}
  ai:
    provider: ${AI_PROVIDER:openai}
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.deepseek.com/v1}
      api-key: ${OPENAI_API_KEY:sk-a61d8a8deb854cc59581734b4fc35bc3}
      model: ${OPENAI_MODEL:deepseek-chat}
  documents:
    extracted-text-max-chars: ${DOC_EXTRACT_MAX_CHARS:20000}
    store-full-extracted-text-to-minio: ${DOC_STORE_FULL_TEXT_TO_MINIO:true}
  agent:
    job-max-concurrency: ${AGENT_JOB_MAX_CONCURRENCY:4}
    doc-max-concurrency: ${AGENT_DOC_MAX_CONCURRENCY:4}
    poll-interval-ms: ${AGENT_POLL_INTERVAL_MS:2000}
    doc-task-max-retries: ${AGENT_DOC_TASK_MAX_RETRIES:3}
  translation:
    cache-ttl-seconds: ${TRANS_CACHE_TTL_SECONDS:604800}
    provider: ${TRANS_PROVIDER:deepl}
    deepl:
      api-key: ${DEEPL_API_KEY:a552bcdc-b62c-4c14-a3fc-7c4fd6955d09:fx}
      base-url: ${DEEPL_BASE_URL:https://api-free.deepl.com}
      max-batch-size: ${DEEPL_MAX_BATCH_SIZE:40}
      min-interval-ms: ${DEEPL_MIN_INTERVAL_MS:0}
  storage:
    s3:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      bucket: ${MINIO_BUCKET:tap-files}
  rag:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:sk-6a01147d106643a79a9a6a738cc6d993}
      embedding-model: text-embedding-v3
      embedding-dimensions: 1024
    milvus:
      host: ${MILVUS_HOST:localhost}
      port: ${MILVUS_PORT:19530}
      collection: course_chunks
    retrieval:
      top-k: 20
      top-parent: 5
      score-threshold: 0.5
    fusion:
      alpha: 0.5
      beta: 0.3
      gamma: 0.1
      delta: 0.1
    rerank:
      enabled: true
      provider: heuristic
      endpoint: ${RAG_RERANK_ENDPOINT:http://127.0.0.1:8101/rerank}
      timeout-ms: 2500
      cross-encoder-weight: 0.7
      top-n: 5
      base-weight: 0.45
      overlap-weight: 0.4
      phrase-weight: 0.1
      annotation-weight: 0.05
    mmr:
      lambda: 0.7
    coverage:
      threshold: 0.15
    evidence:
      max-sentences: 8
      token-ratio-min: 0.25
      token-ratio-max: 0.40
    web:
      tavily-api-key: ${TAVILY_API_KEY:}
      enabled: false
    lucene:
      index-path: ${LUCENE_INDEX_PATH:./data/lucene-index}
  grading:
    export:
      max-concurrency: ${GRADING_EXPORT_MAX_CONCURRENCY:6}
      submit-interval-ms: ${GRADING_EXPORT_SUBMIT_INTERVAL_MS:30}

# PTA spider service
pta:
  spider-url: ${PTA_SPIDER_URL:http://127.0.0.1:8100}
  connect-timeout-ms: ${PTA_SPIDER_CONNECT_TIMEOUT_MS:5000}
  read-timeout-ms: ${PTA_SPIDER_READ_TIMEOUT_MS:20000}
  scheduler:
    max-concurrency: ${PTA_SYNC_MAX_CONCURRENCY:3}
    submit-interval-ms: ${PTA_SYNC_SUBMIT_INTERVAL_MS:200}
  auto-start: ${PTA_SPIDER_AUTO_START:true}
  start-script: ${PTA_SPIDER_START_SCRIPT:../.kiro/start_spider_api.ps1}
  start-timeout-seconds: ${PTA_SPIDER_START_TIMEOUT_SECONDS:25}
  auto-stop: ${PTA_SPIDER_AUTO_STOP:true}
  stop-script: ${PTA_SPIDER_STOP_SCRIPT:../.kiro/stop_spider_api.ps1}
  stop-timeout-seconds: ${PTA_SPIDER_STOP_TIMEOUT_SECONDS:12}
