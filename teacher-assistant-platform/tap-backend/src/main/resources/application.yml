server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: tap-backend
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:tap}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:tap}
    password: ${DB_PASSWORD:tap}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

tap:
  security:
    jwt:
      issuer: ${JWT_ISSUER:tap}
      secret: ${JWT_SECRET:CHANGE_ME_PLEASE_CHANGE_ME_32_BYTES_MINIMUM_123456}
      access-token-ttl-seconds: ${JWT_TTL_SECONDS:3600}
  quota:
    translation-chars-per-day: ${QUOTA_TRANSLATION_CHARS_PER_DAY:200000}
    ai-requests-per-day: ${QUOTA_AI_REQUESTS_PER_DAY:200}
    admin-unlimited: ${QUOTA_ADMIN_UNLIMITED:true}
  ai:
    provider: ${AI_PROVIDER:openai}
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.deepseek.com/v1}
      api-key: ${OPENAI_API_KEY:sk-a61d8a8deb854cc59581734b4fc35bc3}
      model: ${OPENAI_MODEL:deepseek-chat}
  documents:
    extracted-text-max-chars: ${DOC_EXTRACT_MAX_CHARS:20000}
    store-full-extracted-text-to-minio: ${DOC_STORE_FULL_TEXT_TO_MINIO:true}
  agent:
    job-max-concurrency: ${AGENT_JOB_MAX_CONCURRENCY:1}
    doc-max-concurrency: ${AGENT_DOC_MAX_CONCURRENCY:4}
    poll-interval-ms: ${AGENT_POLL_INTERVAL_MS:2000}
    doc-task-max-retries: ${AGENT_DOC_TASK_MAX_RETRIES:3}
  zip-organize:
    job-max-concurrency: ${ZIP_ORGANIZE_JOB_MAX_CONCURRENCY:1}
    item-max-concurrency: ${ZIP_ORGANIZE_ITEM_MAX_CONCURRENCY:3}
    poll-interval-ms: ${ZIP_ORGANIZE_POLL_INTERVAL_MS:2000}
    max-files: ${ZIP_ORGANIZE_MAX_FILES:120}
    max-zip-bytes: ${ZIP_ORGANIZE_MAX_ZIP_BYTES:52428800}
    text-preview-max-chars: ${ZIP_ORGANIZE_TEXT_PREVIEW_MAX_CHARS:6000}
    item-prompt-max-chars: ${ZIP_ORGANIZE_ITEM_PROMPT_MAX_CHARS:6000}
    max-retries: ${ZIP_ORGANIZE_MAX_RETRIES:2}
    low-confidence-threshold: ${ZIP_ORGANIZE_LOW_CONFIDENCE_THRESHOLD:0.6}
  translation:
    cache-ttl-seconds: ${TRANS_CACHE_TTL_SECONDS:604800}
    provider: ${TRANS_PROVIDER:deepl}
    deepl:
      api-key: ${DEEPL_API_KEY:a552bcdc-b62c-4c14-a3fc-7c4fd6955d09:fx}
      base-url: ${DEEPL_BASE_URL:https://api-free.deepl.com}
      max-batch-size: ${DEEPL_MAX_BATCH_SIZE:40}
      min-interval-ms: ${DEEPL_MIN_INTERVAL_MS:0}
  storage:
    s3:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      bucket: ${MINIO_BUCKET:tap-files}
