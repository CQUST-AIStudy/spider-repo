services:
  pta-spider:
    build:
      context: .
      args:
        PYTHON_BASE_IMAGE: "${PYTHON_BASE_IMAGE:-python:3.11-slim-bookworm}"
        DEBIAN_MIRROR: "${DEBIAN_MIRROR:-mirrors.aliyun.com}"
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}"
    image: pta-spider:latest
    container_name: pta-spider
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      SPIDER_PORT: "${SPIDER_PORT:-8100}"
      PTA_HEADLESS: "true"
      PTA_RUNTIME_DIR: /app/runtime
      PTA_CRAWL_DIR: /app/output
      PTA_BROWSER_HOME: /app/runtime/browser
      SE_CACHE_PATH: /app/runtime/.selenium
      PTA_KEEP_BROWSER_OPEN_ON_FAILURE: "false"
      PTA_CHROME_BINARY: /usr/bin/chromium
      PTA_CHROMEDRIVER_PATH: /usr/bin/chromedriver
    ports:
      - "${SPIDER_PORT:-8100}:${SPIDER_PORT:-8100}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./runtime:/app/runtime
      - ./output:/app/output
    restart: unless-stopped
    shm_size: "2gb"
